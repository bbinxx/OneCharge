name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0, v1.0.0-rc)

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Clean and Build Release APK
        # We use standard Gradle here to guarantee CI compatibility without needing a connected emulator/device like run.sh does.
        run: ./gradlew clean assembleRelease

      - name: Build Debug APK (Fallback)
        run: ./gradlew assembleDebug

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneCharge-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
